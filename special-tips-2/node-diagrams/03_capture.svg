<text x="1366" y="400" text-anchor="start" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" font-size="13" fill="#BCB2A4" font-weight="400">1本 = 1色（正解）</text>
<text x="1162" y="448" text-anchor="start" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" font-size="14" fill="#8A8076" font-weight="400">Realize したあとの Index は「点の通し番号」</text>
<text x="1162" y="472" text-anchor="start" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" font-size="14" fill="#8A8076" font-weight="400">になる。0〜36万の連番で Random を引くから、</text>
<text x="1162" y="496" text-anchor="start" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" font-size="14" fill="#8A8076" font-weight="400">1本のレールの中で色が変わってしまう。</text>
<rect x="420" y="640" width="700" height="74" rx="4" fill="#2A1C17" stroke="#FF7A5C" stroke-width="1.5"/>
<rect x="420" y="640" width="4" height="74" fill="#FF7A5C"/>
<text x="438" y="668" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" font-size="16" fill="#EFE7D9">順番が大事。Instance on Points の直後、Realize より前に置く。</text>
<text x="438" y="694" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" font-size="16" fill="#EFE7D9">ここで捕まえた3つは、このあと Realize と Trim を通り抜けて最後まで届く。</text>
