<text x="78" y="588" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" font-size="16" fill="#EFE7D9">Trim のあとの Spline Parameter は、切り取った彗星の区間で 0→1 に振り直される。</text>
<text x="78" y="614" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" font-size="16" fill="#EFE7D9">そこで点線を作ると、点線が彗星と一緒に滑ってしまう。先に「長さ（メートル）」を覚えておけば、点線はレールに貼り付いたまま動かない。</text>
