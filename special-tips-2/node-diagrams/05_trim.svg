<text x="60" y="400" text-anchor="start" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" fill="#FF9A3C" font-weight="700">head = Fract( フレーム × Speed × speed_mul + t_offset )</text>
<text x="60" y="430" text-anchor="start" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#BCB2A4" font-weight="400">Trim の 開始 = head − Tail ／ 終了 = head</text>
<rect x="60" y="500" width="780" height="74" rx="4" fill="#2A1C17" stroke="#FF7A5C" stroke-width="1.5"/>
<rect x="60" y="500" width="4" height="74" fill="#FF7A5C"/>
<text x="78" y="528" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" font-size="16" fill="#EFE7D9">Modulo ではなく Fract。</text>
<text x="78" y="554" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" font-size="16" fill="#EFE7D9">Blender の Modulo は負の値で符号が残るので、ループの一部で挙動が変わる。</text>
<rect x="60" y="620" width="780" height="74" rx="4" fill="#2A2015" stroke="#FF9A3C" stroke-width="1.5"/>
<rect x="60" y="620" width="4" height="74" fill="#FF9A3C"/>
<text x="78" y="648" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" font-size="16" fill="#EFE7D9">秒ではなくフレームを使うと、Speed が「1フレームあたりどれだけ進むか」になる。</text>
<text x="78" y="674" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" font-size="16" fill="#EFE7D9">Speed 0.010 なら 100 フレームで 1 周。</text>
<rect x="880" y="620" width="680" height="74" rx="4" fill="#2A2015" stroke="#FF9A3C" stroke-width="1.5"/>
<rect x="880" y="620" width="4" height="74" fill="#FF9A3C"/>
<text x="898" y="648" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" font-size="16" fill="#EFE7D9">head − Tail が負になる瞬間、Trim が 0 でクランプして頭が潰れる。</text>
<text x="898" y="674" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" font-size="16" fill="#EFE7D9">J字の始点をカメラの外まで伸ばしてあるので、そこは見えない。</text>
</svg>